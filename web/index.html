<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LawEditor</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script type="module" src="./main.js"></script>
</head>
<body class="desk">
<div class="window" id="win" data-agent="lg">

  <aside class="side" id="side">
    <div class="side__head">
      <button class="btn btn--ghost btn--icon" id="side-toggle" aria-label="Open side bar" title="Open side bar"><svg class="icon"><use href="#i-panel-left"/></svg></button>
    </div>
    <button class="btn btn--ghost" data-view="doc" aria-current="page" title="Document"><svg class="icon"><use href="#i-file-text"/></svg><span class="side__text">Document</span></button>
    <button class="btn btn--ghost" data-view="laws" title="Laws"><svg class="icon"><use href="#i-scale"/></svg><span class="side__text">Laws</span></button>
    <button class="btn btn--ghost" data-view="context" title="Context"><svg class="icon"><use href="#i-book-open"/></svg><span class="side__text">Context</span></button>
  </aside>

  <div class="window__main">
    <div class="toolbar">
      <button class="btn btn--ghost btn--icon only-narrow" id="side-open" aria-label="Open side bar"><svg class="icon"><use href="#i-panel-left"/></svg></button>
      <div class="dropdown doc-only" id="kind">
        <button class="btn btn--ghost" aria-haspopup="menu" aria-expanded="false" title="Line type">
          <svg class="icon"><use href="#i-pilcrow"/></svg><span id="kind-label">Text</span><svg class="icon icon--sm"><use href="#i-chevron-down"/></svg>
        </button>
        <div class="menu" role="menu" hidden>
          <button class="menu__item" role="menuitemradio" aria-checked="false" data-kind="title"><svg class="icon"><use href="#i-heading-1"/></svg><span>Title</span><svg class="icon icon--sm menu__check"><use href="#i-check"/></svg></button>
          <button class="menu__item" role="menuitemradio" aria-checked="true" data-kind="text"><svg class="icon"><use href="#i-pilcrow"/></svg><span>Text</span><svg class="icon icon--sm menu__check"><use href="#i-check"/></svg></button>
        </div>
      </div>
      <div class="toolbar__spacer"></div>
      <div class="segmented segmented--icons doc-only" id="view" aria-label="View">
        <button aria-pressed="true" data-view="sentences" aria-label="Sentences" title="Sentences"><svg class="icon"><use href="#i-text"/></svg></button>
        <button aria-pressed="false" data-view="laws" aria-label="Sentences with laws" title="Sentences with laws"><svg class="icon"><use href="#i-rows-2"/></svg></button>
        <button aria-pressed="false" data-view="split" class="hide-narrow" aria-label="Split" title="Split"><svg class="icon"><use href="#i-columns-2"/></svg></button>
      </div>
      <div class="toolbar__spacer"></div>
      <div class="dock-sm"><div id="agent-sm"></div></div>
      <button class="btn btn--primary doc-only" id="gen"><svg class="icon"><use href="#i-wand-sparkles"/></svg><span class="hide-narrow" id="gen-label">Generate LAWs</span></button>
      <button class="btn btn--ghost btn--icon hide-narrow" id="full" aria-label="Full screen" title="Full screen"><svg class="icon"><use href="#i-maximize"/></svg></button>
    </div>

    <main class="page">
      <section class="view" id="view-doc">
        <div class="doc" id="doc" data-view="sentences">
          <div class="split-head"><span class="meta mono">GDD.md</span><span class="meta mono">LAWS.bend</span></div>
        </div>
      </section>

      <section class="view" id="view-laws" hidden>
        <div class="doc">
          <div class="view-head">
            <span class="meta mono">LAWS.bend</span>
            <button class="btn btn--icon btn--round" id="unlock" aria-label="Hold to edit">
              <svg class="status-ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" pathLength="100"/></svg>
              <svg class="icon"><use href="#i-lock"/></svg>
            </button>
          </div>
          <p class="meta view-note" id="laws-note">Hold the lock to edit.</p>
          <div id="laws-read">
            <div id="laws-list"></div>
            <p class="meta mono view-sub">TYPES.bend</p>
            <article class="prose"><pre><code id="types-code"></code></pre></article>
          </div>
          <div id="laws-edit" hidden>
            <label class="field"><span class="field__label mono">LAWS.bend</span><textarea class="input input--mono" id="laws-src" spellcheck="false"></textarea></label>
            <label class="field"><span class="field__label mono">TYPES.bend</span><textarea class="input input--mono" id="types-src" spellcheck="false"></textarea></label>
            <div class="view-actions">
              <button class="btn btn--ghost" id="edit-cancel">Cancel</button>
              <button class="btn btn--primary" id="edit-save">Save</button>
            </div>
          </div>
        </div>
      </section>

      <section class="view" id="view-context" hidden>
        <div class="doc">
          <div class="view-head">
            <span class="meta mono">AGENT.md</span>
            <span class="tag"><svg class="icon icon--sm"><use href="#i-lock"/></svg>Read only</span>
          </div>
          <article class="prose" id="agent-md"></article>
        </div>
      </section>
    </main>

    <p class="meta made-with">Made with <a href="https://github.com/isabellaherman/Bend-UI" target="_blank" rel="noopener">Bend-UI</a></p>

    <div class="dock-lg"><div id="agent-lg"></div></div>
  </div>
</div>
</body>
</html>
